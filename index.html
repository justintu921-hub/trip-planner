<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅程規劃</title>
<style>
  :root{
    --bg:#f6f5f2; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e6e4df;
    --accent:#1a73e8; --accent-ink:#fff; --danger:#c8402f; --ok:#188038;
    --sidebar:440px; --radius:12px;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
  body{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100dvh;width:100%;overflow:hidden}
  aside,main{min-width:0;min-height:0}
  body.list{grid-template-columns:1fr}
  body.list main{display:none}
  body.list aside{border-right:0}
  body.list #days,body.list header{max-width:860px;margin:0 auto;width:100%}

  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:relative}
  #divider{position:absolute;z-index:8;touch-action:none;user-select:none;top:0;bottom:0;right:-5px;width:10px;cursor:col-resize}
  #divider::after{content:"";position:absolute;background:#c9c7c1;border-radius:3px;top:50%;left:3px;width:4px;height:44px;transform:translateY(-50%)}
  #divider:hover::after,#divider.on::after{background:var(--accent)}
  body.list #divider{display:none}

  header{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .title-row{display:flex;align-items:center;gap:6px}
  #tripTitle{flex:1;font-size:20px;font-weight:700;border:0;background:transparent;padding:4px 6px;border-radius:8px;min-width:0}
  #tripTitle:focus{outline:2px solid var(--accent);background:#f3f7fd}
  .toolbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 8px;border-radius:8px;font-size:13px;line-height:1.2;white-space:nowrap}
  button:hover{background:#f3f2ee}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.primary:hover{background:#1765cc}
  button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  button.ghost:hover{background:#f3f2ee;color:var(--ink)}
  select,input[type=date],input[type=time]{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  #startDate{width:122px}
  #mode{width:110px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px}
  .seg button.on{background:var(--ink);color:#fff}
  .search{position:relative;margin-top:10px}
  .search input{width:100%;font:inherit;font-size:14px;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:#faf9f7}
  .search input:focus{outline:2px solid var(--accent);background:#fff}
  .search.replacing input{outline:2px solid #e8710a;background:#fff7ee}
  .search.inserting input{outline:2px solid var(--ok);background:#eef8f0}
  .search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;fill:var(--muted)}
  .results{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:280px;overflow:auto;margin-top:4px}
  .results:empty{display:none}
  .result{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px}
  .result:last-child{border-bottom:0}
  .result:hover{background:#f3f7fd}
  .result b{display:block;font-size:14px;font-weight:600}
  .result span{color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hint.replace{color:#b3530a}
  .hint.insert{color:var(--ok)}
  .hint button{padding:2px 8px;font-size:12px}

  #days{flex:1;overflow:auto;padding:10px 12px 90px;min-height:0}
  .day{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
  .day.active{box-shadow:0 0 0 2px var(--dc)}
  .day-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:#faf9f7;border-bottom:1px solid var(--line);cursor:pointer}
  .day-dot{width:10px;height:10px;border-radius:50%;background:var(--dc);flex:none}
  .day-name{font-weight:700;font-size:14px;flex:1;min-width:0}
  .day-name[contenteditable]{cursor:text;border-radius:4px;padding:0 4px;margin:0 -4px}
  .day-name[contenteditable]:hover{background:#f0efeb}
  .day-head input[type=time]{font-size:12px;padding:2px 4px;border-radius:6px}
  .day-head .hotelBtn{padding:3px 6px;font-size:12px;border-color:transparent;background:transparent}
  .day-head .hotelBtn:hover{background:#f0efeb}
  .load{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
  .load.l0{background:#e6f4ea;color:#137333}.load.l1{background:#fef7e0;color:#b06000}.load.l2{background:#fde9d9;color:#b3530a}.load.l3{background:#fce8e6;color:#c5221f}
  .day-summary{font-size:12px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
  .day-warn{font-size:12px;color:#b3530a;background:#fff7ee;padding:5px 12px;border-bottom:1px solid var(--line)}
  .day-warn.l3{color:#c5221f;background:#fdf1f0}
  .stops{min-height:36px;padding:6px 8px}
  .stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:8px 6px;border-radius:10px;background:#fff;border:1px solid transparent;cursor:grab}
  .stop:hover{background:#faf9f7;border-color:var(--line)}
  .stop.sortable-ghost{opacity:.35;background:#e8f0fe;border:1px dashed var(--accent)}
  .stop.replacing{background:#fff7ee;border-color:#e8710a}
  .stop.fixed{cursor:default;background:#faf9f7}
  .stop.fixed .num{background:#fff;color:var(--dc);border:2px solid var(--dc);font-size:13px}
  .num{width:24px;height:24px;border-radius:50%;background:var(--dc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .stop-body{min-width:0}
  .stop-name{display:inline-block;max-width:100%;font-weight:600;font-size:14px;line-height:1.3;word-break:break-word;border-radius:4px;padding:0 2px;margin:0 -2px;vertical-align:top}
  .stop-name-row{display:block}
  .stop-name[contenteditable]{cursor:text}
  .stop-name[contenteditable]:hover{background:#f0efeb;box-shadow:0 1px 0 #b5b3ad}
  .stop-name[contenteditable]:focus{outline:2px solid var(--accent);background:#fff}
  .stop-addr{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .stop-meta .arrive{background:#f0efeb;border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .stop-meta input{font:inherit;font-size:12px;width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 5px;text-align:right}
  .stop-note{font-size:12px;line-height:1.45;margin-top:5px;padding:4px 8px;border-radius:6px;background:#faf9f7;color:var(--ink);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
  .stop-note:hover{background:#f0efeb}
  .stop-note.blank{color:#b5b3ad;background:transparent;padding-left:0;font-size:11.5px}
  #noteDlg textarea{width:100%;min-height:140px;font:inherit;font-size:15px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
  .stop-actions{display:flex;flex-direction:column;gap:0}
  .stop-actions button{padding:3px 6px;font-size:12px;border-color:transparent;color:var(--muted);background:transparent}
  .stop-actions button:hover{color:var(--ink);background:#f0efeb}
  .stop-actions button.del:hover{color:var(--danger)}
  .leg{display:flex;align-items:center;gap:6px;padding:2px 6px 2px 12px;font-size:12px;color:var(--muted);min-height:40px}
  .leg::before{content:"";width:2px;align-self:stretch;background:var(--line);margin-right:4px;border-radius:2px}
  .leg b{color:var(--ink);font-weight:600}
  .leg.long b{color:#b3530a}
  .leg select{font-size:13px;padding:1px 2px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;width:36px;-webkit-appearance:none;appearance:none;text-align:center}
  .leg select:hover{border-color:var(--line);background:#fff}
  .leg select.custom{background:#eef8f0;border-color:#cfe8d5}
  .leg .ins{margin-left:auto;margin-right:0;width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:20px;font-weight:300;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:#fff;line-height:1}
  .leg .ins:hover{color:var(--ok);border-color:#cfe8d5;background:#eef8f0}
  .leg .ins.on{color:#fff;background:var(--ok);border-color:var(--ok)}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:12px}
  .day-foot{display:flex;gap:6px;padding:6px 10px 10px;justify-content:flex-end}
  .day-foot button{font-size:12px}

  .tl{display:grid;grid-template-columns:64px 1fr;gap:0 10px;padding:6px 12px 10px}
  .tl .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding:8px 0;text-align:right}
  .tl .p{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .tl .p small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .tl .lg{grid-column:2;font-size:12px;color:var(--muted);padding:4px 0 4px 8px;border-left:2px solid var(--line);margin-left:4px}

  /* 口袋名單：小藥丸 */
  .pool .day-head{background:#f0efeb}
  .pool.closed .day-head{border-bottom:0}
  .pool-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
  .pill{display:inline-flex;align-items:center;gap:2px;padding:0 2px 0 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;cursor:grab;max-width:100%}
  .pill:hover{border-color:#c9c7c1;background:#faf9f7}
  .pill.sortable-ghost{opacity:.4;border-style:dashed}
  .pill-name{padding:7px 0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .pill button{border:0;background:transparent;padding:6px 6px;font-size:14px;color:var(--muted);border-radius:999px;line-height:1}
  .pill button:hover{background:#e8f0fe;color:var(--accent)}
  .pill .pill-add{color:var(--accent);font-weight:700}
  .pool-list .empty{width:100%}

  /* 卡片右邊一直行：⋯ 和地標導航鈕同尺寸對齊 */
  .stop-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .stop-actions .more,.stop-actions .navbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:18px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);text-decoration:none;line-height:1}
  .stop-actions .more:hover{background:#f3f2ee;color:var(--ink)}
  .stop-actions .navbtn{border-color:#d4e3fb;background:#f3f7fd;color:var(--accent)}
  .sheet-item .ic .pin{color:var(--accent);vertical-align:middle}
  .stop-actions .navbtn:hover{background:#e8f0fe}
  .stop.fixed .stop-actions{justify-content:center}

  /* 出發模式的時間表列 */
  .tl .p.tap{cursor:pointer;position:relative;padding-right:22px;border-radius:8px}
  .tl .p.tap:hover,.tl .t:hover{background:#faf9f7}
  .tl .p .chev{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#b5b3ad;font-size:20px}
  .tl .t{cursor:pointer}
  .sheet-note{font-size:13px;color:var(--muted);padding:10px 12px;white-space:pre-wrap;background:#faf9f7;border-radius:8px;margin-top:4px}

  /* 動作抽屜 */
  #sheet{padding:8px 8px 10px;max-width:420px}
  .sheet-title{font-weight:700;font-size:14px;padding:8px 10px 10px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:13px 12px;font-size:15px;border-radius:10px}
  .sheet-item:hover{background:#f3f2ee}
  .sheet-item .ic{width:24px;text-align:center;font-size:16px}
  .sheet-item.danger{color:var(--danger)}
  .sheet-cancel{width:100%;margin-top:6px;padding:12px;font-size:15px;border-radius:10px;background:#f3f2ee;border:0}
  @media (max-width:820px){
    #sheet{margin:auto 0 0;max-width:100%;width:100%;border-radius:16px 16px 0 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  }

  /* 出發模式 */
  body.go .search,body.go #hint{display:none}
  body.go .toolbar{display:none}
  .go-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .go-day.today{box-shadow:0 0 0 2px var(--dc)}
  .today-tag{background:var(--dc);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .go-list{padding:4px 8px 8px}
  .go-stop{display:grid;grid-template-columns:32px 1fr auto;gap:6px;align-items:start;padding:8px 4px;border-bottom:1px solid var(--line)}
  .go-stop:last-child{border-bottom:0}
  .go-stop.done .go-name b{text-decoration:line-through;color:var(--muted)}
  .go-stop .chk{display:grid;place-items:center;padding-top:2px}
  .go-stop .chk input{width:20px;height:20px;accent-color:var(--ok)}
  .go-body{min-width:0}
  .go-name{font-size:15px;font-weight:600;line-height:1.3}
  .go-time{font-weight:400;font-size:12px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
  .go-note{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
  .go-exps{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .go-exp{font-size:12px;background:#fff8e6;border:1px solid #f5e6b8;border-radius:6px;padding:3px 8px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
  .go-exp .who{color:var(--muted);white-space:nowrap}
  .go-actions{display:flex;flex-direction:column;gap:4px;align-items:stretch}
  .go-actions .nav{color:var(--accent);text-decoration:none;font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #d4e3fb;background:#f3f7fd;text-align:center}
  .go-actions .exp{font-size:12px;padding:4px 8px}
  .go-leg{font-size:11.5px;color:var(--muted);padding:2px 0 2px 44px}
  .go-stop.other{background:#faf9f7;border-radius:8px;margin-top:6px}
  .settle-body{padding:10px 12px}
  .settle-tb{width:100%;border-collapse:collapse;font-size:13px}
  .settle-tb th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
  .settle-tb td{padding:6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .settle-tb td.pos{color:var(--ok);font-weight:600}
  .settle-tb td.neg{color:var(--danger);font-weight:600}
  .tx-title{font-size:12px;color:var(--muted);margin:12px 0 6px}
  .tx{font-size:15px;padding:8px 10px;background:#eef8f0;border-radius:8px;margin-bottom:6px}

  @media print{
    @page{margin:12mm}
    body{display:block;height:auto;overflow:visible;background:#fff}
    main,#divider,.toolbar,.search,#hint,.seg,#btnMenu,#btnShareTop,.go-top,#toast,dialog{display:none !important}
    aside{border:0;display:block;height:auto}
    header{padding:0 0 8px;border-bottom:2px solid #000;max-width:none}
    #tripTitle{font-size:22px;padding:0}
    #days{overflow:visible;padding:8px 0 0;max-width:none}
    .day{break-inside:avoid;box-shadow:none !important;border:1px solid #bbb;margin-bottom:10px}
    .day-head{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .today-tag{display:none}
    .tl .p.tap{padding-right:0}
    .tl .chev{display:none}
    .go-exp{background:#fff8e6 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .settle{break-before:auto}
    a[href]::after{content:""}
  }

  .sync{width:10px;height:10px;border-radius:50%;background:#b5b3ad;flex:none;margin:0 2px}
  .sync.on{background:var(--ok);box-shadow:0 0 0 3px #e6f4ea}
  .sync.busy{background:#f9ab00;box-shadow:0 0 0 3px #fef7e0}
  .sync.off{background:var(--danger);box-shadow:0 0 0 3px #fce8e6}

  main{position:relative}
  #map{position:absolute;inset:0}
  .map-ui{position:absolute;top:12px;left:12px;right:60px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap}
  .map-badge{background:#fff;padding:6px 10px;border-radius:8px;font-size:12px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .map-ui label{background:#fff;padding:6px 10px;border-radius:8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;gap:6px;align-items:center;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  dialog{border:0;border-radius:14px;padding:20px;max-width:460px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  dialog h3{margin:0 0 8px}
  dialog p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  dialog textarea{width:100%;font:12px/1.4 ui-monospace,monospace;height:80px;border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all}
  dialog input[type=text],dialog input[type=password]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .flight-res,.hotel-cur{background:#f6f5f2;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:8px}
  .flight-res b{font-size:15px}
  .hres{border:1px solid var(--line);border-radius:10px;max-height:200px;overflow:auto;margin-top:6px}
  .hres:empty{display:none}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px}
  .opts label{display:flex;gap:8px;align-items:center;cursor:pointer}

  @media (max-width:820px){
    body{grid-template-columns:1fr;grid-template-rows:var(--mapH,38dvh) 1fr}
    body.list{grid-template-rows:1fr}
    main{order:1}
    aside{order:2;border-right:0;border-top:1px solid var(--line)}
    header{padding-top:18px}
    #divider{top:-10px;bottom:auto;left:0;right:0;width:auto;height:26px;cursor:row-resize}
    #divider::after{top:14px;left:50%;width:44px;height:4px;transform:translateX(-50%)}
    .stop-addr{display:none}
    .map-ui{right:12px}
    .map-badge{display:none}
    /* 手機：工具列一行塞完，分享搬到標題列，提示文字收掉 */
    header{padding:14px 12px 8px}
    .toolbar{gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:6px}
    .toolbar::-webkit-scrollbar{display:none}
    .toolbar button{padding:6px 8px;font-size:12.5px;flex:none}
    .toolbar #btnShare{display:none}
    #btnShareTop{display:inline-block !important;font-size:16px;padding:4px 6px}
    #startDate{width:108px;font-size:12.5px;flex:none}
    #mode{width:96px;font-size:12.5px;flex:none}
    .search{margin-top:8px}
    .search input{padding:8px 10px 8px 34px;font-size:13.5px}
    .search svg{top:9px}
    #hint{display:none}
    #days{padding-top:6px}
  }
</style>
</head>
<body>

<aside>
  <div id="divider" title="拖拉調整大小，連點兩下還原"></div>
  <header>
    <div class="title-row">
      <input id="tripTitle" placeholder="旅程名稱" spellcheck="false">
      <span class="seg"><button id="vMap" class="on">規劃</button><button id="vGo">出發</button></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script>
/* ============================================================ 狀態 */
const KEY = 'trip-planner-v1', RK = 'tp-rapidapi-key';
const DEFAULT_RAPIDAPI_KEY = '6fc269739cmsh4cc83422a43b35ap1d02f2jsnf80478945884';
const rapidKey = () => localStorage.getItem(RK) || DEFAULT_RAPIDAPI_KEY;
const COLORS = ['#1a73e8','#e8710a','#188038','#9334e6','#d93025','#0b8043','#f9ab00','#007b83'];
const MODES = { DRIVING:'🚗', TRANSIT:'🚌', WALKING:'🚶' };
const blankState = () => ({ title:'', mode:'DRIVING', startDate:'', days:[{ start:'09:00', stops:[] }], pool:[], members:[], currency:'JPY', rate:null, expenses:[], done:{} });
let state = blankState();
const roomId = (new URLSearchParams(location.search).get('room') || '').replace(/[^A-Za-z0-9]/g, '') || null;
// activeDay === -1 代表「口袋名單」
let activeDay = 0, view = 'map', showAll = false, replacing = null, inserting = null, hotelFor = null, poolOpen = true;
function normalize(s){ s.pool ||= []; s.members ||= []; s.currency ||= 'JPY'; s.expenses ||= []; s.done ||= {}; if (s.rate === undefined) s.rate = null; return s; }
const listOf = di => di < 0 ? state.pool : state.days[di].stops;
const targetLabel = di => di < 0 ? '口袋名單' : dayLabel(di);
let map, dirService, markers = [], lines = [], placesLib;
const legCache = new Map();

const uid = () => Math.random().toString(36).slice(2, 9);
const loadScript = src => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = () => no(new Error('載入失敗')); document.head.appendChild(t); });
const $ = s => document.querySelector(s);
const dayColor = i => COLORS[i % COLORS.length];
const WD = ['日','一','二','三','四','五','六'];

function dayLabel(di){
  const d = state.days[di];
  if (d.name) return d.name;
  if (state.startDate) { const dt = new Date(state.startDate + 'T00:00:00'); dt.setDate(dt.getDate() + di); return `Day ${di+1} · ${dt.getMonth()+1}/${dt.getDate()} (${WD[dt.getDay()]})`; }
  return `Day ${di+1}`;
}
function dayDate(di){ if (!state.startDate) return ''; const dt = new Date(state.startDate + 'T00:00:00'); dt.setDate(dt.getDate() + di); return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; }  // 用本地日期，不能用 toISOString（會變成 UTC 少一天）

// 住宿：day.hotel === undefined → 跟前一天一樣；null → 不回飯店；物件 → 這天住這
function hotelOf(di){ for (let i = di; i >= 0; i--) { const h = state.days[i].hotel; if (h !== undefined) return h; } return null; }
function hotelInherited(di){ return state.days[di].hotel === undefined && di > 0 && hotelOf(di - 1); }

// 一天的完整順序：出發飯店（虛擬）+ 行程 + 回飯店（虛擬，最後一天沒有）
function seqOf(di){
  const d = state.days[di], seq = [];
  const from = di > 0 ? hotelOf(di - 1) : null;
  if (from) seq.push({ ...from, id:'h0-' + di, fixed:'from', stay:0, note:'', modeTo:d.hotelModeTo });
  d.stops.forEach(s => seq.push(s));
  const to = di < state.days.length - 1 ? hotelOf(di) : null;
  if (to) seq.push({ ...to, id:'h1-' + di, fixed:'to', stay:0, note:'' });
  return seq;
}
const legMode = s => s.modeTo || state.mode;

function load(){
  if (roomId) { try { const c = JSON.parse(localStorage.getItem(KEY + ':room:' + roomId)); if (c && c.days) state = normalize(c); } catch(e){} return; }
  const h = location.hash.slice(1);
  if (h.startsWith('t=')) { try { const s = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(2))); if (s && s.days) { state = normalize(s); save(); toast('已載入分享的行程'); return; } } catch(e){} }
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.days) state = normalize(s); } catch(e){}
  try { poolOpen = localStorage.getItem('tp-pool') !== '0'; } catch(e){}
}
let hashTimer, undoStack = [], lastSaved = null, skipUndo = false;
function save(){
  const now = JSON.stringify(state);
  if (!skipUndo && lastSaved !== null && now !== lastSaved) { undoStack.push(lastSaved); if (undoStack.length > 30) undoStack.shift(); }
  lastSaved = now; updateUndoBtn();
  try { localStorage.setItem(KEY, now); } catch(e){}
  // 同步寫進網址：把網頁加入書籤或加到主畫面，那個連結本身就是存檔
  if (roomId) { schedulePush(); return; }
  clearTimeout(hashTimer); hashTimer = setTimeout(() => { try { history.replaceState(null, '', location.pathname + location.search + '#t=' + LZString.compressToEncodedURIComponent(JSON.stringify(state))); } catch(e){} }, 800);
}
function shareUrl(){ return roomId ? location.origin + location.pathname + '?room=' + roomId : location.origin + location.pathname + '#t=' + LZString.compressToEncodedURIComponent(JSON.stringify(state)); }
async function loadNamedTrip(){
  if (roomId) return;
  const name = new URLSearchParams(location.search).get('trip');
  if (!name || !/^[\w-]+$/.test(name)) return;
  try {
    const r = await fetch(`trips/${name}.json`, { cache:'no-cache' }); if (!r.ok) throw 0;
    const s = await r.json(); if (!s.days) throw 0;
    const stamp = JSON.stringify(s).length + ':' + name;
    if (localStorage.getItem(KEY + ':trip') === stamp) return;
    // 換新版行程時，保留使用者自己記的帳、打勾、旅伴
    const keep = { expenses:state.expenses, done:state.done, members:state.members, rate:state.rate };
    state = normalize(s); if (keep.expenses.length) Object.assign(state, keep);
    save(); localStorage.setItem(KEY + ':trip', stamp); render(); toast(`已載入「${s.title || name}」`);
  } catch(e) { toast('找不到這份行程'); }
}

/* ============================================================ Google Maps */
async function initMap(){
  const { Map } = await google.maps.importLibrary('maps');
  await google.maps.importLibrary('routes');
  placesLib = await google.maps.importLibrary('places');
  map = new Map($('#map'), {
    center:{ lat:25.04, lng:121.53 }, zoom:11,
    mapTypeControl:false, streetViewControl:false, fullscreenControl:false, clickableIcons:true,
    styles:[
      { featureType:'poi.business', elementType:'labels', stylers:[{ visibility:'off' }] },
      { featureType:'poi.medical', stylers:[{ visibility:'off' }] },
      { featureType:'poi.school', stylers:[{ visibility:'off' }] },
      { featureType:'poi.government', stylers:[{ visibility:'off' }] },
      { featureType:'poi.place_of_worship', stylers:[{ visibility:'off' }] },
      { featureType:'poi.sports_complex', stylers:[{ visibility:'off' }] },
      { featureType:'transit', elementType:'labels.icon', stylers:[{ visibility:'off' }] },
      { featureType:'road', elementType:'labels.icon', stylers:[{ visibility:'off' }] },
      { featureType:'administrative.land_parcel', stylers:[{ visibility:'off' }] },
      { featureType:'landscape', stylers:[{ saturation:-25 }] },
      { featureType:'water', stylers:[{ saturation:-20 }] },
    ],
  });
  dirService = new google.maps.DirectionsService();
  map.addListener('click', async e => {
    if (!e.placeId) return; e.stop();
    const p = new placesLib.Place({ id:e.placeId });
    await p.fetchFields({ fields:['displayName','formattedAddress','location'] });
    pickPlace({ name:p.displayName, addr:p.formattedAddress, lat:p.location.lat(), lng:p.location.lng(), pid:p.id });
  });
  $('#badge').textContent = '搜尋地點，或點地圖上的景點加入';
  render();
  if (roomId) { $('#btnRoom').hidden = true; $('#btnLeaveRoom').hidden = false; joinRoom(); } else loadNamedTrip();
}

/* ---------- 搜尋 ---------- */
async function textSearch(q, n = 8){
  const { places } = await placesLib.Place.searchByText({ textQuery:q, fields:['displayName','formattedAddress','location','id'], locationBias:(map && map.getBounds()) || undefined, language:'zh-TW', maxResultCount:n });
  return places.map(p => ({ name:p.displayName, addr:p.formattedAddress || '', lat:p.location.lat(), lng:p.location.lng(), pid:p.id }));
}
function resultList(box, items, onPick, emptyText){
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = `<div class="result"><span>${emptyText || '找不到，換個關鍵字試試'}</span></div>`; return; }
  for (const p of items) {
    const d = document.createElement('div'); d.className = 'result'; d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = p.name; d.querySelector('span').textContent = p.addr;
    d.onclick = () => onPick(p); box.appendChild(d);
  }
}
let searchTimer;
async function search(q){
  const box = $('#results'); box.innerHTML = ''; if (!q.trim()) return;
  try { resultList(box, await textSearch(q), p => { pickPlace(p); box.innerHTML = ''; $('#q').value = ''; }); }
  catch(e) { console.error(e); box.innerHTML = '<div class="result"><span>搜尋失敗：' + (e.message || e) + '</span></div>'; }
}
$('#q').addEventListener('input', e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(e.target.value), 450); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); search(e.target.value); } if (e.key === 'Escape') { $('#results').innerHTML = ''; cancelPick(); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').innerHTML = ''; });

/* ============================================================ 行程操作 */
function pickPlace(p){
  if (replacing) {
    const s = listOf(replacing.di).find(x => x.id === replacing.id);
    if (s) { const old = s.name; Object.assign(s, { name:p.name, addr:p.addr || '', lat:p.lat, lng:p.lng, pid:p.pid || '' }); toast(`已把「${old}」換成「${p.name}」`); }
    replacing = null; save(); render(); return;
  }
  if (inserting) {
    const { di, index } = inserting; inserting = null; activeDay = di;
    state.days[di].stops.splice(index, 0, newStop(p)); save(); render(); toast(`已插入 ${dayLabel(di)}：${p.name}`); return;
  }
  addStop(p);
}
const newStop = p => ({ id:uid(), name:p.name, addr:p.addr || '', lat:p.lat, lng:p.lng, pid:p.pid || '', stay:60, note:p.note || '' });
function addStop(p, di = activeDay){ listOf(di).push(newStop(p)); if (di < 0) poolOpen = true; save(); render(); toast(`已加入 ${targetLabel(di)}：${p.name}`); }
function removeStop(di, id){ const l = listOf(di), i = l.findIndex(s => s.id === id); if (i < 0) return; const [x] = l.splice(i, 1); save(); render(); toastUndo(`已刪除「${x.name}」`); }
function duplicateStop(di, id){ const list = listOf(di), i = list.findIndex(s => s.id === id); list.splice(i + 1, 0, { ...list[i], id:uid() }); save(); render(); toast('已複製一份在下面，拖到想要的位置'); }
function toPool(di, id){ const l = listOf(di), i = l.findIndex(s => s.id === id); if (i < 0) return; const [s] = l.splice(i, 1); state.pool.push(s); poolOpen = true; save(); render(); toast(`「${s.name}」放回口袋`); }
function startReplace(di, id){ inserting = null; replacing = { di, id }; render(); $('#q').focus(); }
function startInsert(di, index){ replacing = null; inserting = { di, index }; render(); $('#q').focus(); }
function cancelPick(){ if (replacing || inserting) { replacing = inserting = null; render(); } }
function addDay(){ state.days.push({ start:'09:00', stops:[] }); activeDay = state.days.length - 1; save(); render(); }
function removeDay(di){ if (state.days.length === 1) state.days[0].stops = []; else state.days.splice(di, 1); activeDay = Math.min(activeDay, state.days.length - 1); save(); render(); }

/* ---------- 車程 ---------- */
const legKey = (a, b, mode) => `${mode}|${a.lat.toFixed(5)},${a.lng.toFixed(5)}|${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
function fmtDur(sec){ const m = Math.round(sec / 60); return m < 60 ? `${m} 分` : `${Math.floor(m / 60)} 小時${m % 60 ? ' ' + (m % 60) + ' 分' : ''}`; }
function fmtDist(m){ return m < 1000 ? `${m} 公尺` : `${(m / 1000).toFixed(1)} 公里`; }
function addMin(hhmm, min){ const [h, m] = hhmm.split(':').map(Number); const t = h * 60 + m + min; return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const pathOf = leg => leg.steps.flatMap(st => st.path).map(ll => ({ lat:ll.lat(), lng:ll.lng() }));

// 把一天切成「同交通方式」的連續段，每段一次查完；大眾運輸只能逐段查
async function routeDay(di){
  const seq = seqOf(di); if (seq.length < 2) return false;
  let changed = false;
  const groups = []; // {mode, from, to} 索引範圍（含）
  for (let i = 0; i < seq.length - 1; i++) {
    const m = legMode(seq[i]), g = groups[groups.length - 1];
    if (g && g.mode === m && m !== 'TRANSIT') g.to = i + 1; else groups.push({ mode:m, from:i, to:i + 1 });
  }
  for (const g of groups) {
    const pts = seq.slice(g.from, g.to + 1);
    const missing = pts.slice(0, -1).some((p, i) => !legCache.has(legKey(p, pts[i + 1], g.mode)));
    if (!missing) continue;
    changed = true;
    try {
      const r = await dirService.route({ origin:pts[0], destination:pts[pts.length - 1], waypoints:pts.slice(1, -1).map(s => ({ location:s, stopover:true })), travelMode:g.mode, language:'zh-TW' });
      r.routes[0].legs.forEach((leg, i) => legCache.set(legKey(pts[i], pts[i + 1], g.mode), { sec:leg.duration.value, m:leg.distance.value, path:pathOf(leg) }));
    } catch(e) {
      console.warn('route fail', g.mode, e.code || e);
      // 整段一起查失敗（常見是其中一站到不了，例如不同島），退回逐段查，只讓真的到不了的那段顯示查不到
      for (let i = 0; i < pts.length - 1; i++) {
        const k = legKey(pts[i], pts[i + 1], g.mode); if (legCache.has(k)) continue;
        if (pts.length > 2) { try { const r = await dirService.route({ origin:pts[i], destination:pts[i + 1], travelMode:g.mode, language:'zh-TW' }); const leg = r.routes[0].legs[0]; legCache.set(k, { sec:leg.duration.value, m:leg.distance.value, path:pathOf(leg) }); continue; } catch(e2){} }
        legCache.set(k, { err:true });
      }
    }
  }
  return changed;
}
function drawRoutes(){
  lines.forEach(l => l.setMap(null)); lines = [];
  if (activeDay < 0) return;
  const seq = seqOf(activeDay), col = dayColor(activeDay);
  for (let i = 0; i < seq.length - 1; i++) {
    const m = legMode(seq[i]), c = legCache.get(legKey(seq[i], seq[i + 1], m));
    const dashed = m === 'TRANSIT' || !c || c.err;
    const path = c && c.path ? c.path : [{ lat:seq[i].lat, lng:seq[i].lng }, { lat:seq[i + 1].lat, lng:seq[i + 1].lng }];
    lines.push(new google.maps.Polyline({ map, path, strokeColor:col, strokeOpacity:dashed ? 0 : .85, strokeWeight:m === 'WALKING' ? 3 : 4,
      icons:dashed ? [{ icon:{ path:'M 0,-1 0,1', strokeOpacity:.8, strokeColor:col, scale:3 }, offset:'0', repeat:'12px' }] : [] }));
  }
}

/* ---------- 每天統計 + 負荷指數 ---------- */
function dayStats(di){
  const day = state.days[di], seq = seqOf(di);
  let clock = day.start || '09:00', drive = 0, dist = 0, pending = false, maxLeg = 0, n = 0;
  const rows = [];
  seq.forEach((s, i) => {
    if (!s.fixed) n++;
    rows.push({ type:'stop', s, i, n, arrive:clock });
    clock = addMin(clock, +s.stay || 0);
    if (i < seq.length - 1) {
      const m = legMode(s), c = legCache.get(legKey(s, seq[i + 1], m));
      if (c && !c.err) { drive += c.sec; dist += c.m; maxLeg = Math.max(maxLeg, c.sec); clock = addMin(clock, Math.round(c.sec / 60)); }
      else if (!c) pending = true;
      rows.push({ type:'leg', c, a:s, b:seq[i + 1], mode:m, custom:!!s.modeTo, insertIndex:(s.fixed === 'from') ? 0 : day.stops.findIndex(x => x.id === s.id) + 1 });
    }
  });
  const endMin = toMin(day.start || '09:00') + seq.reduce((a, s) => a + (+s.stay || 0), 0) + Math.round(drive / 60);
  return { rows, drive, dist, pending, maxLeg, end:clock, endMin, n, nReal:day.stops.filter(s => +s.stay > 0).length, seq };
}
function loadLevel(st){
  const warns = []; let lv = 0;
  const dm = st.drive / 60, ml = st.maxLeg / 60, km = st.dist / 1000;
  const push = (l, t) => { warns.push(t); lv = Math.max(lv, l); };
  if (st.n === 0) return { lv:0, warns:[], label:'' };
  if (dm > 240) push(3, `移動 ${fmtDur(st.drive)}，超過 4 小時`); else if (dm > 180) push(2, `移動 ${fmtDur(st.drive)}，超過 3 小時`); else if (dm > 120) push(1, `移動 ${fmtDur(st.drive)}`);
  if (km > 250) push(3, `距離 ${km.toFixed(0)} 公里`); else if (km > 150) push(2, `距離 ${km.toFixed(0)} 公里`);
  if (ml > 120) push(3, `單段 ${fmtDur(st.maxLeg)}`); else if (ml > 90) push(2, `單段 ${fmtDur(st.maxLeg)}`);
  if (st.nReal > 8) push(3, `${st.nReal} 個地點太多`); else if (st.nReal > 6) push(2, `${st.nReal} 個地點偏多`); else if (st.nReal > 4) push(1, `${st.nReal} 個地點`);
  if (st.endMin > 22 * 60) push(3, `約 ${st.end} 才結束`); else if (st.endMin > 21 * 60) push(2, `約 ${st.end} 才結束`); else if (st.endMin > 20 * 60) push(1, `約 ${st.end} 結束`);
  return { lv, warns, label:['輕鬆','適中','偏滿','爆量'][lv] };
}

function onDragEnd(evt){
  const from = +evt.from.dataset.day, to = +evt.to.dataset.day;
  const idxIn = (container, el) => [...container.querySelectorAll('.stop:not(.fixed)')].indexOf(el);
  const fromList = listOf(from), toList = listOf(to);
  const moved = fromList.find(s => s.id === evt.item.dataset.id); if (!moved) return render();
  fromList.splice(fromList.indexOf(moved), 1);
  let ni = idxIn(evt.to, evt.item); if (ni < 0) ni = toList.length;
  toList.splice(Math.min(ni, toList.length), 0, moved);
  activeDay = to; save(); render();
  toastUndo(from === to ? `已移動「${moved.name}」` : `「${moved.name}」移到 ${targetLabel(to)}`);
}

async function pushPlan(){

async function exportPdf(){

    await Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);

    const W = 794, box = document.createElement('div'); box.className = 'pdf-root';
    box.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;background:#fff;padding:32px 36px;font-family:${getComputedStyle(document.body).fontFamily};color:#1d1d1b`;

    box.appendChild(h);

    document.body.appendChild(box);
    const canvas = await html2canvas(box, { scale:2, useCORS:true, backgroundColor:'#fff', windowWidth:W });
    box.remove();
    const { jsPDF } = window.jspdf, pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const imgW = pw, pageHpx = Math.floor(canvas.width * ph / pw);
    let y = 0, first = true;
    while (y < canvas.height) {
      const slice = document.createElement('canvas'); slice.width = canvas.width; slice.height = Math.min(pageHpx, canvas.height - y);
      slice.getContext('2d').drawImage(canvas, 0, y, canvas.width, slice.height, 0, 0, canvas.width, slice.height);
      if (!first) pdf.addPage(); first = false;
      pdf.addImage(slice.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, imgW, slice.height * pw / canvas.width);

    }
    pdf.save(`${state.title || '旅程'}.pdf`); toast('PDF 已產生');
  } catch(e) { console.error(e); toast('PDF 產生失敗：' + e.message); }
}

function settlementEl(){
  const el = document.createElement('section'); el.className = 'day settle';
  const members = state.members, exps = state.expenses;
  if (!exps.length) { el.innerHTML = '<div class="day-head" style="cursor:default"><span class="day-name">💰 結算</span></div><div class="empty">還沒有記帳</div>'; return el; }
  let unconverted = 0, total = 0; const paid = {}, owed = {}; members.forEach(m => { paid[m] = 0; owed[m] = 0; });
  exps.forEach(e => { const v = toBase(e); if (v === null) { unconverted++; return; } total += v; paid[e.paidBy] = (paid[e.paidBy] || 0) + v; const each = v / (e.split.length || 1); e.split.forEach(m => owed[m] = (owed[m] || 0) + each); });

  const bal = names.map(m => ({ m, b:(paid[m] || 0) - (owed[m] || 0) }));
  // 最少轉帳次數：欠最多的還給被欠最多的
  const debt = bal.filter(x => x.b < -0.5).map(x => ({ ...x, b:-x.b })).sort((a, b) => b.b - a.b), cred = bal.filter(x => x.b > 0.5).sort((a, b) => b.b - a.b), tx = [];

    <div class="day-head" style="cursor:default"><span class="day-name">💰 結算</span><span style="font-size:12px;color:var(--muted)">共 ${exps.length} 筆 · ${fmtMoney(total)}${twd(total)}</span></div>
    <div class="settle-body">
      ${unconverted ? `<div class="day-warn">⚠ 有 ${unconverted} 筆幣別換算不了，先設匯率</div>` : ''}

      ${tx.length ? tx.map(t => `<div class="tx"><b>${t.from}</b> → <b>${t.to}</b> ${fmtMoney(t.v)}${twd(t.v)}</div>`).join('') : '<div class="empty">大家剛好打平</div>'}
    </div>`;
  return el;
}

function drawMarkers(){
  markers.forEach(m => m.setMap(null)); markers = [];
  const bounds = new google.maps.LatLngBounds(); let any = false;
  state.days.forEach((day, di) => {
    const active = di === activeDay, seq = seqOf(di); let n = 0;
    seq.forEach(s => {
      if (!s.fixed) n++;
      const isHotel = !!s.fixed, title = `${dayLabel(di)} ${isHotel ? '🏨' : n + '.'} ${s.name}`;
      let m;
      if (!active && !showAll) m = new google.maps.Marker({ map, position:{ lat:s.lat, lng:s.lng }, title, icon:{ path:google.maps.SymbolPath.CIRCLE, scale:5, fillColor:'#9a9a94', fillOpacity:.8, strokeColor:'#fff', strokeWeight:1.5 }, zIndex:1 });
      else if (isHotel) m = new google.maps.Marker({ map, position:{ lat:s.lat, lng:s.lng }, title, icon:{ path:'M -8,-8 L 8,-8 L 8,8 L -8,8 Z', scale:1, fillColor:'#fff', fillOpacity:1, strokeColor:dayColor(di), strokeWeight:2.5 }, label:{ text:'🏨', fontSize:'11px' }, zIndex:active ? 9 : 2 });
      else m = new google.maps.Marker({ map, position:{ lat:s.lat, lng:s.lng }, title, label:{ text:String(n), color:'#fff', fontSize:'12px', fontWeight:'700' }, icon:{ path:google.maps.SymbolPath.CIRCLE, scale:active ? 13 : 10, fillColor:dayColor(di), fillOpacity:active ? 1 : .6, strokeColor:'#fff', strokeWeight:2 }, zIndex:active ? 10 : 2 });
      m.addListener('click', () => { activeDay = di; render(); }); markers.push(m);
      if (active) { bounds.extend(m.getPosition()); any = true; }
    });
  });
  // 口袋名單：空心灰圈，池子被選取時用深一點
  state.pool.forEach(s => {
    const m = new google.maps.Marker({ map, position:{ lat:s.lat, lng:s.lng }, title:`👜 ${s.name}`, icon:{ path:google.maps.SymbolPath.CIRCLE, scale:activeDay < 0 ? 9 : 6, fillColor:'#fff', fillOpacity:.9, strokeColor:activeDay < 0 ? '#1d1d1b' : '#9a9a94', strokeWeight:2 }, zIndex:activeDay < 0 ? 8 : 1 });
    m.addListener('click', () => { activeDay = -1; render(); }); markers.push(m);
    if (activeDay < 0) { bounds.extend(m.getPosition()); any = true; }
  });
  if (any && map._lastDay !== activeDay) { map.fitBounds(bounds, 60); map._lastDay = activeDay; }
}

const gmMode = m => ({ DRIVING:'driving', TRANSIT:'transit', WALKING:'walking' })[m || state.mode];
function gmapsUrl(seq){ const p = x => `${x.lat},${x.lng}`; return `https://www.google.com/maps/dir/?api=1&origin=${p(seq[0])}&destination=${p(seq[seq.length - 1])}&waypoints=${seq.slice(1, -1).map(p).join('|')}&travelmode=${gmMode()}`; }
// 導航：不給 origin，Google Maps 會用目前位置
function placeUrl(s){ return s.pid ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name)}&query_place_id=${s.pid}` : `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`; }
function navUrl(s, mode){ return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}${s.pid ? '&destination_place_id=' + s.pid : ''}&travelmode=${gmMode(mode)}`; }

/* ============================================================ 一鍵排順 */
// 頭尾固定（有飯店就用飯店；沒有就固定第一站、把離起點最遠的當終點），中間交給 Google 排最短
let lastOrder = null;
async function optimizeDay(di){
  const day = state.days[di], stops = day.stops.slice();
  if (stops.length < 3) return;
  if (stops.length > 25) return toast('一天最多 25 個地點才能排');
  const from = di > 0 ? hotelOf(di - 1) : null, to = di < state.days.length - 1 ? hotelOf(di) : null;
  let origin, dest, middle, pinFirst = null, pinLast = null;
  if (from) origin = from; else { pinFirst = stops.shift(); origin = pinFirst; }
  if (to) { dest = to; middle = stops; }
  else {
    const d2 = (a, b) => (a.lat - b.lat) ** 2 + ((a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180)) ** 2;
    let far = 0; stops.forEach((s, i) => { if (d2(origin, s) > d2(origin, stops[far])) far = i; });
    pinLast = stops.splice(far, 1)[0]; dest = pinLast; middle = stops;
  }
  if (!middle.length) return toast('沒有可以重排的中途點');
  if (!await ask(`把「${dayLabel(di)}」依開車距離重排？\n\n注意：\n• 只看距離，不管營業時間、訂位時段\n• 一律用開車算，某段設了步行／大眾運輸也一樣\n• 頭尾（飯店${from || to ? '' : '或第一站'}）固定不動\n\n排完 8 秒內可以按「復原」。`, '一鍵排順', '重排')) return;
  toast('排順中…');
  try {
    const r = await dirService.route({ origin, destination:dest, waypoints:middle.map(s => ({ location:s, stopover:true })), optimizeWaypoints:true, travelMode:'DRIVING', language:'zh-TW' });
    const order = r.routes[0].waypoint_order.map(i => middle[i]);
    const next = [...(pinFirst ? [pinFirst] : []), ...order, ...(pinLast ? [pinLast] : [])];
    if (next.every((s, i) => s.id === day.stops[i].id)) return toast('已經是最順的順序了');
    lastOrder = { di, stops:day.stops };
    day.stops = next; save(); render();
    const t = $('#toast'); t.innerHTML = `已依開車距離重排 <button id="undoOpt" style="margin-left:8px;padding:2px 8px;font-size:12px;background:#fff">復原</button>`; t.style.pointerEvents = 'auto'; t.classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = ''; }, 8000);
    $('#undoOpt').onclick = () => { if (lastOrder) { state.days[lastOrder.di].stops = lastOrder.stops; lastOrder = null; save(); render(); } t.classList.remove('show'); t.style.pointerEvents = ''; };
  } catch(e) { console.warn(e); toast('排不出來：' + (e.code || e.message || e)); }
}

/* ============================================================ 航班 */
async function lookupFlight(no, date, key){
  const url = `https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(no)}/${date}?withAircraftImage=false&withLocation=false`;
  const r = await fetch(url, { headers:{ 'X-RapidAPI-Key':key, 'X-RapidAPI-Host':'aerodatabox.p.rapidapi.com' } });
  if (r.status === 204 || r.status === 404) return [];
  if (!r.ok) throw new Error(`查詢失敗 (${r.status})：${(await r.text()).slice(0, 120)}`);
  const j = await r.json(); return Array.isArray(j) ? j : (j.flights || []);
}
const lt = t => { if (!t) return ''; const s = t.local || t.utc || t; const m = /(\d{2}):(\d{2})/.exec(String(s)); return m ? `${m[1]}:${m[2]}` : ''; };
let flightHit = null;
$('#btnFlight').addEventListener('click', () => {
  $('#fDate').value = dayDate(activeDay) || state.startDate || new Date().toISOString().slice(0, 10);
  $('#fKey').value = localStorage.getItem(RK) || ''; $('#fKeyWrap').hidden = true;
  $('#fRes').innerHTML = ''; $('#fApplyArr').hidden = $('#fApplyDep').hidden = true; flightHit = null;
  $('#flightDlg').showModal(); $('#fNo').focus();
});
$('#fLookup').addEventListener('click', async () => {
  const no = $('#fNo').value.trim().toUpperCase().replace(/\s+/g, ''), date = $('#fDate').value, typed = $('#fKey').value.trim();
  if (!no || !date) return toast('請填航班號和日期');
  if (typed) localStorage.setItem(RK, typed);
  const key = rapidKey();
  $('#fRes').innerHTML = '<div class="flight-res">查詢中…</div>';
  try {
    const fl = await lookupFlight(no, date, key);
    if (!fl.length) { $('#fRes').innerHTML = '<div class="flight-res">查不到這班，確認一下航班號和日期（只能查未來約 1 年、過去 7 天內）</div>'; return; }
    const f = fl[0], dep = f.departure || {}, arr = f.arrival || {};
    const side = a => { const ap = a.airport || {}; return { ap:ap.shortName || ap.name || ap.iata || '?', full:ap.name || '', iata:ap.iata, lat:ap.location && ap.location.lat, lng:ap.location && ap.location.lon, t:lt(a.scheduledTime), term:a.terminal || '' }; };
    flightHit = { no:(f.number || no).replace(/\s+/g, ''), dep:side(dep), arr:side(arr), airline:f.airline && f.airline.name, status:f.status };
    const term = s => s.term ? `（${s.term} 航廈）` : '';
    $('#fRes').innerHTML = `<div class="flight-res"><b>${flightHit.no}</b> ${flightHit.airline || ''}<br>🛫 ${flightHit.dep.ap} ${flightHit.dep.t || '?'}${term(flightHit.dep)}<br>🛬 ${flightHit.arr.ap} ${flightHit.arr.t || '?'}${term(flightHit.arr)}<br><small>時間都是當地時間${fl.length > 1 ? `；這天有 ${fl.length} 個航段，取第一段` : ''}</small></div>`;
    $('#fApplyArr').hidden = !flightHit.arr.t; $('#fApplyDep').hidden = !flightHit.dep.t;
  } catch(e) { $('#fRes').innerHTML = `<div class="flight-res">${e.message}</div>`; if (/40[13]|429/.test(e.message)) $('#fKeyWrap').hidden = false; }
});
async function airportPlace(s){
  try { const { places } = await placesLib.Place.searchByText({ textQuery:`${s.full || s.ap} ${s.iata || ''} airport`, fields:['displayName','formattedAddress','location','id'], language:'zh-TW', maxResultCount:1, ...(s.lat ? { locationBias:{ center:{ lat:s.lat, lng:s.lng }, radius:20000 } } : {}) }); const p = places[0]; if (p) return { name:p.displayName, addr:p.formattedAddress, lat:p.location.lat(), lng:p.location.lng(), pid:p.id }; } catch(e){}
  if (s.lat) return { name:`${s.ap} 機場${s.iata ? ' (' + s.iata + ')' : ''}`, addr:'', lat:s.lat, lng:s.lng, pid:'' };
  return null;
}
function flightDay(){ const date = $('#fDate').value; const i = state.days.findIndex((_, di) => dayDate(di) === date); if (i >= 0) return i; toast(`${date} 不在行程日期內，加到 ${dayLabel(activeDay >= 0 ? activeDay : 0)}`); return activeDay >= 0 ? activeDay : 0; }
$('#fApplyArr').addEventListener('click', async () => {
  const di = flightDay(), d = state.days[di]; activeDay = di; d.start = addMin(flightHit.arr.t, 40);
  const ap = await airportPlace(flightHit.arr);
  if (ap) d.stops.unshift({ id:uid(), ...ap, stay:0, note:`${flightHit.no} ${flightHit.arr.t} 抵達${flightHit.arr.term ? ' ' + flightHit.arr.term + ' 航廈' : ''}（出發時間已含 40 分入境領行李）` });
  save(); render(); $('#flightDlg').close(); toast(`${dayLabel(di)} 出發時間設為 ${d.start}`);
});
$('#fApplyDep').addEventListener('click', async () => {
  const di = flightDay(), d = state.days[di]; activeDay = di;
  const ap = await airportPlace(flightHit.dep);
  if (ap) d.stops.push({ id:uid(), ...ap, stay:0, note:`${flightHit.no} ${flightHit.dep.t} 起飛${flightHit.dep.term ? ' ' + flightHit.dep.term + ' 航廈' : ''}，建議 ${addMin(flightHit.dep.t, -120)} 前到機場` });
  save(); render(); $('#flightDlg').close(); toast(`已加到 ${dayLabel(di)} 最後`);
});

/* ---------- 拖拉分隔線 ---------- */
(() => {
  const dv = $('#divider'), root = document.documentElement, isMobile = () => matchMedia('(max-width:820px)').matches;
  try { const h = localStorage.getItem('tp-mapH'); if (h) root.style.setProperty('--mapH', h); const w = localStorage.getItem('tp-sbW'); if (w) root.style.setProperty('--sidebar', w); } catch(e){}
  let drag = null;
  dv.addEventListener('pointerdown', e => { drag = { m:isMobile() }; dv.setPointerCapture(e.pointerId); dv.classList.add('on'); e.preventDefault(); });
  dv.addEventListener('pointermove', e => {
    if (!drag) return;
    if (drag.m) { const h = Math.min(Math.max(e.clientY, innerHeight * .12), innerHeight * .85); root.style.setProperty('--mapH', h + 'px'); }
    else { const w = Math.min(Math.max(e.clientX, 300), innerWidth - 320); root.style.setProperty('--sidebar', w + 'px'); }
  });
  const end = () => { if (!drag) return; dv.classList.remove('on'); try { if (drag.m) localStorage.setItem('tp-mapH', root.style.getPropertyValue('--mapH')); else localStorage.setItem('tp-sbW', root.style.getPropertyValue('--sidebar')); } catch(e){} drag = null; if (map) google.maps.event.trigger(map, 'resize'); };
  dv.addEventListener('pointerup', end); dv.addEventListener('pointercancel', end);
  dv.addEventListener('dblclick', () => { root.style.removeProperty('--mapH'); root.style.removeProperty('--sidebar'); try { localStorage.removeItem('tp-mapH'); localStorage.removeItem('tp-sbW'); } catch(e){} if (map) google.maps.event.trigger(map, 'resize'); });
})();

// 取代瀏覽器內建 confirm()（內嵌瀏覽器／iPhone 主畫面模式不支援）
function ask(msg, title = '確認', okText = '確定', danger = false){
  return new Promise(res => {
    $('#askTitle').textContent = title; $('#askMsg').textContent = msg; const ok = $('#askOk'); ok.textContent = okText; ok.style.background = danger ? 'var(--danger)' : ''; ok.style.borderColor = danger ? 'var(--danger)' : '';
    const d = $('#askDlg'); const done = v => { d.close(); ok.onclick = null; $('#askCancel').onclick = null; d.oncancel = null; res(v); };
    ok.onclick = () => done(true); $('#askCancel').onclick = () => done(false); d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
  });
}

function undo(){
  if (!undoStack.length) return toast('沒有可以復原的');
  const prev = undoStack.pop(); skipUndo = true;
  try { state = normalize(JSON.parse(prev)); } finally { skipUndo = false; }
  lastSaved = null; save(); lastSaved = prev;  // 這次不再推進 undo 堆疊
  if (activeDay >= state.days.length) activeDay = state.days.length - 1;
  if (roomRef) state.expenses.forEach(pushExpense);
  render(); toast(`已復原${undoStack.length ? `，還可以再退 ${undoStack.length} 步` : ''}`);
  updateUndoBtn();
}
function updateUndoBtn(){ const b = $('#btnUndo'); if (b) b.hidden = !undoStack.length; }
// 拖拉、刪除這種容易誤觸的動作：跳一個帶「復原」的提示
function toastUndo(msg){
  const t = $('#toast'); t.innerHTML = ''; t.append(msg + ' '); const b = document.createElement('button'); b.textContent = '復原'; b.style.cssText = 'margin-left:8px;padding:2px 10px;font-size:12px;background:#fff;border-radius:6px'; b.onclick = () => { undo(); }; t.appendChild(b);
  t.style.pointerEvents = 'auto'; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = ''; }, 6000);
}
